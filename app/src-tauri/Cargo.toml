[package]
name = "vydex"
# La versión vive solo en app/package.json (tauri.conf.json la lee desde ahí).
version = "0.0.0"
description = "Vydex: descarga video y audio en la máxima calidad"
authors = ["MacrosS"]
edition = "2024"

[lib]
# El sufijo `_lib` evita choques de nombre entre la librería y el binario en Windows.
name = "vydex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt"] }

# Una sola instancia (Windows y Linux): un segundo clic trae al frente la ventana abierta.
# En macOS no hace falta (el sistema reutiliza la app) y su canal en /tmp es compartido.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
